---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: fonts
    fonts:
      nerd-fonts:
       - Iosevka
       - IosevkaTerm
       - IosevkaTermSlab
       - JetBrainsMono
      google-fonts:
       - Noto Sans
      url-fonts:
       - name: Miracode
         url: https://github.com/IdreesInc/Miracode/releases/latest/download/Miracode.ttf
       - name: Monocraft
         url: https://github.com/IdreesInc/Monocraft/releases/latest/download/Monocraft-ttf.zip

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - name: kylegospo/bazzite
          chroot: fedora-44-x86_64
        - name: ublue-os/staging
          chroot: fedora-44-x86_64
        - name: yanqiyu/waydroid
          chroot: fedora-44-x86_64
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      nonfree: negativo17
    install:
      skip-unavailable: true
      packages:
        - android-tools
        - cronie-anacron
        - firewall-applet
        - fish
        - gamescope
        - neovim
        - podman-compose
        - steam-devices
        - tailscale
        - terra-release
        - terra-release-extras
        - terra-release-mesa
        - zsh

  - type: chezmoi
    repository: "https://codeberg.org/radioaddition/dotfiles"
    all-users: false
    file-conflict-policy: "replace"
  
  - type: akmods
    base: main
    install:
      - v4l2loopback
      - kvmfr
      - ryzen-smu
      - zenergy
    
  - type: justfiles
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
